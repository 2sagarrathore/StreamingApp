# ---------------------------------------------------------------------------
# Local parity stack. Same images the Jenkins pipeline pushes to ECR, so a
# green `docker compose up --build` is a decent smoke test before you deploy
# to EKS. Browse to http://localhost:3000 -- everything (APIs, websockets)
# is proxied through the frontend's nginx on a single origin.
# ---------------------------------------------------------------------------
name: streamingapp

x-backend-common: &backend-common
  restart: unless-stopped
  depends_on:
    mongo:
      condition: service_healthy
  environment: &backend-env
    MONGO_URI: mongodb://mongo:27017/${MONGO_DB:-streamingapp}
    JWT_SECRET: ${JWT_SECRET:-changeme}
    CLIENT_URLS: ${CLIENT_URLS:-http://localhost:3000}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_REGION: ${AWS_REGION:-ap-south-1}
    AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}

services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  auth:
    <<: *backend-common
    build:
      context: ./backend
      dockerfile: authService/Dockerfile
    image: streamingapp/auth-service:local
    environment:
      <<: *backend-env
      PORT: 3001
    ports:
      - "${AUTH_PORT:-3001}:3001"

  streaming:
    <<: *backend-common
    build:
      context: ./backend
      dockerfile: streamingService/Dockerfile
    image: streamingapp/streaming-service:local
    environment:
      <<: *backend-env
      PORT: 3002
      AWS_CDN_URL: ${AWS_CDN_URL:-}
      STREAMING_PUBLIC_URL: ${STREAMING_PUBLIC_URL:-http://localhost:3000/svc/streaming}
    ports:
      - "${STREAMING_PORT:-3002}:3002"

  admin:
    <<: *backend-common
    build:
      context: ./backend
      dockerfile: adminService/Dockerfile
    image: streamingapp/admin-service:local
    environment:
      <<: *backend-env
      PORT: 3003
      AWS_CDN_URL: ${AWS_CDN_URL:-}
    ports:
      - "${ADMIN_PORT:-3003}:3003"

  chat:
    <<: *backend-common
    build:
      context: ./backend
      dockerfile: chatService/Dockerfile
    image: streamingapp/chat-service:local
    environment:
      <<: *backend-env
      PORT: 3004
    ports:
      - "${CHAT_PORT:-3004}:3004"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Build args intentionally omitted: the Dockerfile defaults are already
      # same-origin relative paths, which is exactly what we want locally too.
    image: streamingapp/frontend:local
    restart: unless-stopped
    environment:
      AUTH_UPSTREAM: auth:3001
      STREAMING_UPSTREAM: streaming:3002
      ADMIN_UPSTREAM: admin:3003
      CHAT_UPSTREAM: chat:3004
      MAX_UPLOAD_SIZE: 1024m
    depends_on:
      - auth
      - streaming
      - admin
      - chat
    ports:
      - "3000:8080"

volumes:
  mongo-data:
