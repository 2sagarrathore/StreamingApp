# Shared proxy settings pulled in by every /svc/* location.
#
# NOTE: timeouts are deliberately NOT set here. nginx rejects a duplicate
# directive in the same context, so a location that needs a longer
# proxy_read_timeout (streaming, admin uploads, websockets) could not override
# a value inherited from this include. Each location sets its own.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
# The backends' CORS middleware inspects Origin; forwarding it keeps the
# allow-list check meaningful instead of silently passing as a null origin.
proxy_set_header Origin            $http_origin;
proxy_connect_timeout 10s;
