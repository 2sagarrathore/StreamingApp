{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "streamingapp.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "streamingapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Contains the MongoDB password, hence Secret rather than ConfigMap.
  MONGO_URI: {{ include "streamingapp.mongoUri" . | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required — pass --set secrets.jwtSecret=$(openssl rand -hex 32)" .Values.secrets.jwtSecret | quote }}
  {{- if .Values.secrets.awsAccessKeyId }}
  # Only set these when IRSA is unavailable. With a service-account role
  # attached, the AWS SDK picks up credentials automatically and these
  # variables should stay empty.
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | quote }}
  {{- end }}
{{- end }}
