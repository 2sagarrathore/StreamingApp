{{- $root := . -}}
{{- if .Values.podDisruptionBudget.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $minReplicas := ternary $svc.autoscaling.minReplicas $svc.replicaCount $svc.autoscaling.enabled }}
{{- if gt (int $minReplicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "streamingapp.componentName" (dict "root" $root "name" $name) }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "streamingapp.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  # Only emitted for components that run more than one replica — a PDB on a
  # single-replica Deployment blocks node drains forever.
  minAvailable: {{ $root.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "streamingapp.selectorLabels" (dict "root" $root "name" $name) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
